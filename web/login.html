<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Shelton Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%238b5cf6'/><text x='16' y='22' font-size='17' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'>S</text></svg>">
<style>
  :root {
    --a: #8b5cf6; --b: #22d3ee; --c: #f472b6;
    --bg: #07060d; --text: #f1effa; --muted: #a29dbf; --line: rgba(255,255,255,.12);
    color-scheme: dark;
    font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  button, input { font: inherit; color: inherit; }

  /* ---------- Fondo vivo: auroras + estrellas + grilla ---------- */
  .aurora { position: fixed; inset: -20%; filter: blur(70px) saturate(140%); opacity: .75; pointer-events: none; }
  .aurora i { position: absolute; width: 46vmax; height: 46vmax; border-radius: 50%; mix-blend-mode: screen; }
  .aurora i:nth-child(1) { background: radial-gradient(circle, var(--a), transparent 62%); left: 8%; top: 12%; animation: drift1 22s ease-in-out infinite; }
  .aurora i:nth-child(2) { background: radial-gradient(circle, var(--b), transparent 62%); right: 6%; top: 28%; animation: drift2 26s ease-in-out infinite; }
  .aurora i:nth-child(3) { background: radial-gradient(circle, var(--c), transparent 62%); left: 32%; bottom: 0; animation: drift3 30s ease-in-out infinite; opacity: .7; }
  @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 33% { transform: translate(14vw,8vh) scale(1.15); } 66% { transform: translate(-6vw,14vh) scale(.9); } }
  @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 40% { transform: translate(-16vw,-10vh) scale(1.2); } 75% { transform: translate(4vw,10vh) scale(.95); } }
  @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(.9); } 50% { transform: translate(10vw,-16vh) scale(1.15); } }
  .grid { position: fixed; inset: 0; pointer-events: none; opacity: .22;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 56px 56px; mask-image: radial-gradient(ellipse at 50% 55%, #000 10%, transparent 70%);
    animation: gridmove 18s linear infinite; }
  @keyframes gridmove { to { background-position: 56px 56px, 56px 56px; } }
  canvas#stars { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.65)); }

  /* ---------- Escena ---------- */
  .scene { position: relative; z-index: 2; height: 100%; display: grid; place-items: center; padding: 24px 16px; overflow-y: auto; }
  .stack { width: min(420px, 100%); display: grid; gap: 22px; justify-items: center; }

  /* ---------- Logo animado ---------- */
  .logo-wrap { position: relative; width: 168px; height: 168px; display: grid; place-items: center; animation: float 6s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .ring { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--a), var(--b), var(--c), var(--a));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
    animation: spin 6s linear infinite; filter: drop-shadow(0 0 14px rgba(139,92,246,.7)); }
  .ring.r2 { inset: 16px; animation-duration: 9s; animation-direction: reverse; opacity: .7;
    background: conic-gradient(from 90deg, transparent, var(--b), transparent 40%, var(--c), transparent 75%); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .halo { position: absolute; inset: 26px; border-radius: 50%; background: radial-gradient(circle, rgba(139,92,246,.55), transparent 70%);
    animation: pulse 3.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(.9); opacity: .6; } 50% { transform: scale(1.12); opacity: 1; } }
  .core { position: relative; width: 92px; height: 92px; border-radius: 30px; display: grid; place-items: center; overflow: hidden;
    background: linear-gradient(140deg, var(--a), #4c1d95 60%, #1e1b4b); box-shadow: 0 18px 50px rgba(124,58,237,.55), inset 0 1px 0 rgba(255,255,255,.35);
    transform-style: preserve-3d; transition: transform .25s ease-out; }
  .core::after { content: ""; position: absolute; inset: -40%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.45) 50%, transparent 60%);
    animation: sheen 4.5s ease-in-out infinite; }
  @keyframes sheen { 0%, 55% { transform: translateX(-60%); } 100% { transform: translateX(60%); } }
  .core img { width: 100%; height: 100%; object-fit: cover; }
  .core svg.s { width: 58px; height: 58px; }
  .core svg.s path { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.8s .3s cubic-bezier(.65,0,.35,1) forwards, glow 3s 2.1s ease-in-out infinite; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes glow { 0%,100% { filter: drop-shadow(0 0 2px #fff); } 50% { filter: drop-shadow(0 0 10px #c4b5fd); } }
  .orbit { position: absolute; inset: -10px; animation: spin 12s linear infinite; }
  .orbit.o2 { inset: 6px; animation-duration: 8s; animation-direction: reverse; }
  .orbit.o3 { inset: -24px; animation-duration: 18s; }
  .orbit b { position: absolute; top: 50%; left: -4px; width: 9px; height: 9px; margin-top: -4px; border-radius: 50%;
    background: var(--b); box-shadow: 0 0 12px var(--b), 0 0 24px var(--b); }
  .orbit.o2 b { background: var(--c); box-shadow: 0 0 12px var(--c); width: 7px; height: 7px; left: auto; right: -3px; }
  .orbit.o3 b { background: #fff; box-shadow: 0 0 10px #fff; width: 5px; height: 5px; top: 0; left: 50%; }

  /* ---------- Títulos ---------- */
  .title { text-align: center; }
  .title h1 { margin: 0; font-size: clamp(28px, 6vw, 38px); letter-spacing: -.02em; font-weight: 800;
    background: linear-gradient(90deg, #fff, #c4b5fd, var(--b), #fff); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 7s linear infinite; }
  @keyframes shimmer { to { background-position: 300% 0; } }
  .title p { margin: 8px 0 0; color: var(--muted); font-size: 15px; min-height: 1.4em; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--b); vertical-align: -2px; margin-left: 2px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Tarjeta ---------- */
  .card { position: relative; width: 100%; padding: 26px 24px 22px; border-radius: 24px;
    background: linear-gradient(160deg, rgba(30,26,48,.72), rgba(14,12,24,.72)); backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%); border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08); display: grid; gap: 14px;
    animation: rise .9s .25s cubic-bezier(.2,.8,.2,1) both; }
  .card::before { content: ""; position: absolute; inset: -1px; border-radius: 25px; padding: 1px; pointer-events: none;
    background: conic-gradient(from var(--ang, 0deg), transparent 0 70%, var(--a), var(--b), transparent 95%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
    animation: border 5s linear infinite; }
  @property --ang { syntax: "<angle>"; initial-value: 0deg; inherits: false; }
  @keyframes border { to { --ang: 360deg; } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
  .card.shake { animation: shake .45s cubic-bezier(.36,.07,.19,.97); }
  @keyframes shake { 15%,85% { transform: translateX(-2px); } 30%,70% { transform: translateX(5px); } 45%,55% { transform: translateX(-8px); } }

  .field { position: relative; }
  .field input { width: 100%; height: 56px; padding: 22px 46px 6px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(6,5,12,.55); outline: none; transition: border-color .2s, box-shadow .2s, background .2s; font-size: 15.5px; }
  .field input:focus { border-color: var(--a); box-shadow: 0 0 0 4px rgba(139,92,246,.22); background: rgba(6,5,12,.75); }
  .field label { position: absolute; left: 16px; top: 18px; color: var(--muted); font-size: 15px; pointer-events: none; transition: all .18s ease; }
  .field input:focus + label, .field input:not(:placeholder-shown) + label { top: 8px; font-size: 11.5px; color: #c4b5fd; letter-spacing: .02em; }
  .field .ico { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: grid; place-items: center;
    border-radius: 9px; border: 0; background: none; color: var(--muted); cursor: pointer; }
  .field .ico:hover { color: #fff; background: rgba(255,255,255,.06); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13.5px; color: var(--muted); }
  .check { display: inline-flex; gap: 8px; align-items: center; cursor: pointer; user-select: none; }
  .check input { appearance: none; width: 18px; height: 18px; border-radius: 6px; border: 1px solid rgba(255,255,255,.25); margin: 0; display: grid; place-items: center; cursor: pointer; }
  .check input:checked { background: linear-gradient(140deg, var(--a), var(--b)); border-color: transparent; }
  .check input:checked::after { content: "✓"; font-size: 12px; color: #fff; font-weight: 800; }
  .caps { color: #fbbf24; font-size: 12.5px; display: none; }
  .caps.on { display: block; }
  .err { min-height: 0; font-size: 13.5px; color: #fecaca; background: rgba(239,68,68,.12); border: 1px solid rgba(239,68,68,.35);
    border-radius: 12px; padding: 0 12px; max-height: 0; overflow: hidden; opacity: 0; transition: all .25s ease; }
  .err.on { max-height: 80px; padding: 10px 12px; opacity: 1; }

  .go { position: relative; height: 54px; border: 0; border-radius: 15px; cursor: pointer; font-weight: 800; font-size: 16px; letter-spacing: .01em;
    color: #fff; overflow: hidden; background: linear-gradient(100deg, var(--a), #7c3aed 40%, var(--b)); background-size: 200% 100%;
    box-shadow: 0 12px 34px rgba(124,58,237,.5); transition: transform .15s, box-shadow .2s, background-position .6s; }
  .go:hover { transform: translateY(-1px); background-position: 100% 0; box-shadow: 0 16px 40px rgba(34,211,238,.35); }
  .go:active { transform: translateY(1px) scale(.99); }
  .go:disabled { cursor: default; filter: saturate(.7); }
  .go .lbl { position: relative; z-index: 1; display: inline-flex; gap: 10px; align-items: center; }
  .go .spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  .go.loading .spin { display: inline-block; }
  .go .rip { position: absolute; border-radius: 50%; background: rgba(255,255,255,.45); transform: scale(0); animation: rip .6s ease-out forwards; pointer-events: none; }
  @keyframes rip { to { transform: scale(4); opacity: 0; } }
  .foot { text-align: center; color: var(--muted); font-size: 12.5px; opacity: .85; }
  .foot code { background: rgba(255,255,255,.07); padding: 2px 6px; border-radius: 6px; font-size: 11.5px; }

  /* ---------- Éxito ---------- */
  body.ok .card { animation: out .6s ease-in forwards; }
  body.ok .logo-wrap { animation: zoom .9s cubic-bezier(.7,0,.3,1) forwards; }
  body.ok .flash { opacity: 1; }
  @keyframes out { to { opacity: 0; transform: translateY(20px) scale(.96); } }
  @keyframes zoom { 40% { transform: scale(1.1); } 100% { transform: scale(14); opacity: 0; } }
  .flash { position: fixed; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .6s .35s;
    background: radial-gradient(circle at 50% 40%, rgba(139,92,246,.95), #07060d 70%); }

  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; } canvas#stars { display: none; } }
  @media (max-height: 700px) { .logo-wrap { width: 128px; height: 128px; } .core { width: 74px; height: 74px; border-radius: 24px; } .stack { gap: 14px; } }
</style>
</head>
<body>
<div class="aurora"><i></i><i></i><i></i></div>
<div class="grid"></div>
<canvas id="stars"></canvas>
<div class="vignette"></div>
<div class="flash"></div>

<main class="scene">
  <div class="stack">
    <div class="logo-wrap" id="logo">
      <div class="halo"></div>
      <div class="ring"></div><div class="ring r2"></div>
      <div class="orbit"><b></b></div><div class="orbit o2"><b></b></div><div class="orbit o3"><b></b></div>
      <div class="core" id="core"><svg class="s" viewBox="0 0 60 60"><path d="M43 14c-3-3-8-5-13-5-8 0-14 4-14 10 0 13 28 8 28 22 0 6-6 10-14 10-6 0-11-2-15-6"/></svg></div>
    </div>
    <div class="title"><h1 id="name">Shelton Studio</h1><p><span id="tag"></span><span class="caret"></span></p></div>

    <form class="card" id="form" autocomplete="on" novalidate>
      <div class="field"><input id="u" name="username" autocomplete="username" placeholder=" " required autocapitalize="none" spellcheck="false"><label for="u">Usuario</label>
        <span class="ico" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span></div>
      <div class="field"><input id="p" name="password" type="password" autocomplete="current-password" placeholder=" " required><label for="p">Contraseña</label>
        <button type="button" class="ico" id="eye" title="Mostrar contraseña" aria-label="Mostrar contraseña"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      <div class="caps" id="caps">⇪ Bloq Mayús está activado</div>
      <div class="row"><label class="check"><input type="checkbox" id="remember" checked> Mantener la sesión iniciada</label></div>
      <div class="err" id="err" role="alert"></div>
      <button class="go" id="go"><span class="lbl"><span class="spin"></span><span id="go-t">Entrar</span></span></button>
      <div class="foot">¿Olvidaste la contraseña? En el servidor: <code>venv/bin/python -m app.auth reset-password</code></div>
    </form>
  </div>
</main>

<script>
"use strict";
const $ = (s) => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Marca blanca
fetch("/api/auth/brand").then((r) => r.json()).then((b) => {
  if (b.product_name) { $("#name").textContent = b.product_name; document.title = "Entrar · " + b.product_name; }
  const r = document.documentElement.style;
  if (b.accent) r.setProperty("--a", b.accent);
  if (b.accent2) r.setProperty("--b", b.accent2);
  if (b.logo_url) $("#core").innerHTML = `<img src="${b.logo_url.replace(/"/g, "")}" alt="">`;
  typeTag(b.tagline || "Tu estudio de contenido con IA");
  if (b.auth === false) location.replace("/");
}).catch(() => typeTag("Tu estudio de contenido con IA"));

function typeTag(text) {
  const el = $("#tag"); if (reduce) { el.textContent = text; return; }
  let i = 0; const t = setInterval(() => { el.textContent = text.slice(0, ++i); if (i >= text.length) clearInterval(t); }, 38);
}

// Estrellas y constelaciones que reaccionan al mouse
(() => {
  if (reduce) return;
  const c = $("#stars"), x = c.getContext("2d");
  let W, H, pts = [], mouse = { x: -999, y: -999 };
  const resize = () => {
    W = c.width = innerWidth * devicePixelRatio; H = c.height = innerHeight * devicePixelRatio;
    const n = Math.min(110, Math.floor(innerWidth * innerHeight / 14000));
    pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .25 * devicePixelRatio,
      vy: (Math.random() - .5) * .25 * devicePixelRatio, r: (Math.random() * 1.4 + .4) * devicePixelRatio, tw: Math.random() * 6.28 }));
  };
  resize(); addEventListener("resize", resize);
  addEventListener("pointermove", (e) => { mouse.x = e.clientX * devicePixelRatio; mouse.y = e.clientY * devicePixelRatio; });
  const link = 130 * devicePixelRatio;
  (function frame(t) {
    x.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1;
      const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
      if (d < 160 * devicePixelRatio) { p.x += dx / d * .6; p.y += dy / d * .6; }
      const a = .45 + .4 * Math.sin(t / 900 + p.tw);
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.28); x.fillStyle = `rgba(220,215,255,${a})`; x.fill();
    }
    for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i], b = pts[j], d = Math.hypot(a.x - b.x, a.y - b.y);
      if (d < link) { x.strokeStyle = `rgba(139,92,246,${(1 - d / link) * .28})`; x.lineWidth = devicePixelRatio * .8; x.beginPath(); x.moveTo(a.x, a.y); x.lineTo(b.x, b.y); x.stroke(); }
    }
    requestAnimationFrame(frame);
  })(0);
})();

// El logo se inclina siguiendo el mouse
addEventListener("pointermove", (e) => {
  if (reduce) return;
  const rx = (e.clientY / innerHeight - .5) * -16, ry = (e.clientX / innerWidth - .5) * 16;
  $("#core").style.transform = `perspective(500px) rotateX(${rx}deg) rotateY(${ry}deg)`;
});

// Formulario
$("#eye").onclick = () => { const p = $("#p"); p.type = p.type === "password" ? "text" : "password"; $("#eye").style.color = p.type === "text" ? "#fff" : ""; p.focus(); };
$("#p").addEventListener("keyup", (e) => $("#caps").classList.toggle("on", e.getModifierState && e.getModifierState("CapsLock")));
$("#go").addEventListener("pointerdown", (e) => {
  const b = $("#go"), r = b.getBoundingClientRect(), s = Math.max(r.width, r.height), d = document.createElement("span");
  d.className = "rip"; d.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`;
  b.append(d); setTimeout(() => d.remove(), 650);
});
function fail(msg) {
  const e = $("#err"); e.textContent = msg; e.classList.add("on");
  const f = $("#form"); f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
}
$("#form").onsubmit = async (ev) => {
  ev.preventDefault();
  const u = $("#u").value.trim(), p = $("#p").value;
  if (!u || !p) return fail("Escribe tu usuario y tu contraseña");
  $("#err").classList.remove("on");
  const go = $("#go"); go.disabled = true; go.classList.add("loading"); $("#go-t").textContent = "Entrando…";
  try {
    const r = await fetch("/api/auth/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: u, password: p, remember: $("#remember").checked }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.detail || "No se pudo entrar");
    $("#go-t").textContent = `¡Hola, ${j.username}!`;
    document.body.classList.add("ok");
    const next = new URLSearchParams(location.search).get("next");
    setTimeout(() => location.replace(next && next.startsWith("/") && !next.startsWith("//") ? next : "/"), reduce ? 50 : 950);
  } catch (e) {
    fail(e.message); go.disabled = false; go.classList.remove("loading"); $("#go-t").textContent = "Entrar"; $("#p").select();
  }
};
setTimeout(() => $("#u").focus(), 400);
</script>
</body>
</html>
